name: Publier Xam Xam Xara et préserver le laboratoire Soninké

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Préparer le site statique
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les fichiers nécessaires
        run: |
          test -f index.html
          test -f corpus.html
          test -f styles.css
          test -f app.js
          test -f corpus.css
          test -f corpus.js
          test -f data/soninke-samples.jsonl
          test -f maquette-xam-xam-xara/index.html
          test -f maquette-xam-xam-xara/styles.css
          test -f maquette-xam-xam-xara/app.js
          test -f audio/snk-00001.wav
          test -f audio/wolof/00000-abal.wav

      - name: Préparer les deux interfaces sans écraser les sources
        run: |
          mkdir -p dist/soninke-lab
          for file in ./*.html ./*.css ./*.js; do
            if [ -f "$file" ]; then cp "$file" dist/soninke-lab/; fi
          done
          cp -R data dist/soninke-lab/data
          cp -R audio dist/soninke-lab/audio
          cp -R maquette-xam-xam-xara/. dist/

      - name: Préparer l’artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Déployer le site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer vers GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
