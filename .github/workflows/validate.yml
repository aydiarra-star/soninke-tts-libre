name: Validation statique

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/soninke-tts-lab-prototype

permissions:
  contents: read

jobs:
  validate:
    name: Vérifier le prototype et le corpus
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check app.js
          node --check corpus.js
      - name: Vérifier le corpus, les phrases initiales et les liens documentaires
        run: node scripts/validate-project.mjs
