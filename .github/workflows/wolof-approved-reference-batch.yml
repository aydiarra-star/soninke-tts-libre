name: Wolof approved-reference audio batch

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Nombre d’entrées à générer (1 à 10)"
        required: true
        default: "10"
        type: string
      start_index:
        description: "Index de départ dans les entrées admissibles (0 pour commencer)"
        required: true
        default: "0"
        type: string
      confirm_user_voice:
        description: "Confirmer que l’utilisateur a écouté et approuvé la voix de référence"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  generate-approved-reference-batch:
    if: inputs.confirm_user_voice == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Require private voice reference
        env:
          WOLOF_REFERENCE_AUDIO_B64: ${{ secrets.WOLOF_REFERENCE_AUDIO_B64 }}
        run: |
          if [ -z "$WOLOF_REFERENCE_AUDIO_B64" ]; then
            echo "::error::Secret WOLOF_REFERENCE_AUDIO_B64 is missing. No fallback voice will be used."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audio system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install reference-conditioned voice engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install omnivoice soundfile
      - name: Generate approved-reference dictionary batch
        env:
          WOLOF_REFERENCE_AUDIO_B64: ${{ secrets.WOLOF_REFERENCE_AUDIO_B64 }}
        run: |
          python wolof_tts/generate_reference_voice_batch.py \
            --batch \
            --batch-size "${{ inputs.batch_size }}" \
            --start-index "${{ inputs.start_index }}" \
            --voice-identity-approved \
            --output-dir wolof_reference_voice_outputs
      - name: Upload generated WAV files and manifest for review
        uses: actions/upload-artifact@v4
        with:
          name: wolof-approved-reference-batch-${{ inputs.start_index }}
          path: wolof_reference_voice_outputs/
          if-no-files-found: error
          retention-days: 1
