name: Wolof lexicon audio batch

on:
  push:
    branches:
      - feat/wolof-lexicon-audio-batches
    paths:
      - "wolof_tts/generate_lexicon_batch.py"
      - "wolof_tts/import_kaikki_candidates.py"
      - ".github/workflows/wolof-lexicon-audio-batch.yml"
      - "data/wolof-fr-dictionary.json"
  workflow_dispatch:
    inputs:
      start_index:
        description: "Index de départ dans le lexique trié (0, 10, 20...)"
        required: true
        default: "0"
        type: string
      batch_size:
        description: "Nombre de mots à générer (1 à 20)"
        required: true
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WOLF_BATCH_START: ${{ github.event_name == 'workflow_dispatch' && inputs.start_index || '10' }}
      WOLF_BATCH_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.batch_size || '10' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'git+https://github.com/huggingface/parler-tts.git' transformers accelerate soundfile numpy
          python -m pip install --force-reinstall --no-deps torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch, torchaudio; print('torch', torch.__version__, 'cuda?', torch.cuda.is_available()); print('torchaudio', torchaudio.__version__)"
      - name: Import Kaikki review-only candidates
        run: python wolof_tts/import_kaikki_candidates.py --output data/kaikki-wolof-candidates.json
      - name: Generate and validate dictionary batch
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python wolof_tts/generate_lexicon_batch.py --start-index "$WOLF_BATCH_START" --batch-size "$WOLF_BATCH_SIZE"
      - name: Upload WAVs and manifest
        uses: actions/upload-artifact@v4
        with:
          name: wolof-lexicon-audio-batch-${{ env.WOLF_BATCH_START }}
          path: wolof-lexicon-audio-batch.zip
          if-no-files-found: error
          retention-days: 14
