name: Wolof private-reference batch generation

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: "Index de départ dans les entrées admissibles triées (0 pour commencer)"
        required: true
        type: number
        default: 0
      batch_size:
        description: "Nombre maximal d'entrées pour ce lot"
        required: true
        type: choice
        options:
          - "1"
          - "5"
          - "10"
        default: "10"
      voice_identity_approved:
        description: "Confirmer que le test de référence exact a été écouté et reconnu comme votre voix"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate-private-batch:
    if: ${{ inputs.voice_identity_approved == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Require private reference
        env:
          WOLOF_REFERENCE_AUDIO_B64: ${{ secrets.WOLOF_REFERENCE_AUDIO_B64 }}
        run: |
          if [ -z "$WOLOF_REFERENCE_AUDIO_B64" ]; then
            echo "::error::Secret WOLOF_REFERENCE_AUDIO_B64 is missing. No fallback voice will be used."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audio dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install OmniVoice
        run: |
          python -m pip install --upgrade pip
          python -m pip install omnivoice soundfile

      - name: Generate a limited reference-conditioned batch
        env:
          WOLOF_REFERENCE_AUDIO_B64: ${{ secrets.WOLOF_REFERENCE_AUDIO_B64 }}
          WOLOF_REFERENCE_TRANSCRIPT: ${{ secrets.WOLOF_REFERENCE_TRANSCRIPT }}
          START_INDEX_INPUT: ${{ inputs.start_index }}
        run: |
          # GitHub's numeric input may arrive as "0.0"; argparse expects an integer.
          if [[ "$START_INDEX_INPUT" =~ ^[0-9]+([.]0+)?$ ]]; then
            START_INDEX="${START_INDEX_INPUT%%.*}"
          else
            echo "::error::start_index must be a non-negative integer."
            exit 1
          fi
          python wolof_tts/generate_reference_voice_batch.py \
            --batch \
            --start-index "$START_INDEX" \
            --batch-size "${{ inputs.batch_size }}" \
            --voice-identity-approved \
            --output-dir wolof_reference_voice_outputs

      - name: Upload private batch for review (no repository commit)
        uses: actions/upload-artifact@v4
        with:
          name: wolof-reference-batch-start-${{ inputs.start_index }}
          path: wolof_reference_voice_outputs/
          if-no-files-found: error
          retention-days: 1
