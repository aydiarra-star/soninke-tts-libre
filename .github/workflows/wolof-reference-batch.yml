name: Wolof private-reference batch generation

on:
  workflow_dispatch:
    inputs:
      start_index:
        description: "Index de départ dans les entrées admissibles triées (0 pour commencer)"
        required: true
        type: number
        default: 0
      batch_size:
        description: "Nombre maximal d'entrées pour ce lot"
        required: true
        type: choice
        options:
          - "5"
          - "10"
          - "25"
          - "50"
        default: "50"
      voice_identity_approved:
        description: "Confirmer que le test de référence exact a été écouté et reconnu comme votre voix"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  generate-private-batch:
    if: ${{ inputs.voice_identity_approved == true && (inputs.batch_size == '25' || inputs.batch_size == '50' || (inputs.batch_size == '10' && matrix.shard < 2) || (inputs.batch_size == '5' && matrix.shard == 0)) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Require private reference
        env:
          WOLOF_REFERENCE_AUDIO_B64: ${{ secrets.WOLOF_REFERENCE_AUDIO_B64 }}
        run: |
          if [ -z "$WOLOF_REFERENCE_AUDIO_B64" ]; then
            echo "::error::Secret WOLOF_REFERENCE_AUDIO_B64 is missing. No fallback voice will be used."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audio dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install OmniVoice
        run: |
          python -m pip install --upgrade pip
          python -m pip install omnivoice soundfile

      - name: Generate a parallel shard of the reference-conditioned batch
        env:
          WOLOF_REFERENCE_AUDIO_B64: ${{ secrets.WOLOF_REFERENCE_AUDIO_B64 }}
          WOLOF_REFERENCE_TRANSCRIPT: ${{ secrets.WOLOF_REFERENCE_TRANSCRIPT }}
          START_INDEX_INPUT: ${{ inputs.start_index }}
          BATCH_SIZE_INPUT: ${{ inputs.batch_size }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          if [[ "$START_INDEX_INPUT" =~ ^[0-9]+([.]0+)?$ ]]; then
            BASE_INDEX="${START_INDEX_INPUT%%.*}"
          else
            echo "::error::start_index must be a non-negative integer."
            exit 1
          fi

          case "$BATCH_SIZE_INPUT" in
            5)  SHARD_SIZE=1 ;;
            10) SHARD_SIZE=2 ;;
            25) SHARD_SIZE=5 ;;
            50) SHARD_SIZE=10 ;;
            *) echo "::error::Unsupported batch size."; exit 1 ;;
          esac
          START_INDEX=$((BASE_INDEX + SHARD_INDEX * SHARD_SIZE))
          echo "Worker $SHARD_INDEX: entries $START_INDEX through $((START_INDEX + SHARD_SIZE - 1))"

          python wolof_tts/generate_reference_voice_batch.py \
            --batch \
            --start-index "$START_INDEX" \
            --batch-size "$SHARD_SIZE" \
            --voice-identity-approved \
            --output-dir "wolof_reference_voice_outputs"

          mv wolof_reference_voice_outputs/manifest.json "wolof_reference_voice_outputs/manifest-shard-$SHARD_INDEX.json"

      - name: Upload shard privately for assembly
        uses: actions/upload-artifact@v4
        with:
          name: wolof-reference-shard-${{ matrix.shard }}-start-${{ inputs.start_index }}
          path: wolof_reference_voice_outputs/
          if-no-files-found: error
          retention-days: 1

  assemble-private-batch:
    if: ${{ inputs.voice_identity_approved == true }}
    needs: generate-private-batch
    runs-on: ubuntu-latest
    steps:
      - name: Download and merge all successful shards
        uses: actions/download-artifact@v4
        with:
          pattern: wolof-reference-shard-*-start-${{ inputs.start_index }}
          path: wolof_reference_voice_outputs
          merge-multiple: true

      - name: Assemble the manifests without losing entries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("wolof_reference_voice_outputs")
          manifests = sorted(root.glob("manifest-shard-*.json"))
          if not manifests:
              raise SystemExit("No shard manifests were downloaded.")
          entries = []
          for path in manifests:
              payload = json.loads(path.read_text(encoding="utf-8"))
              entries.extend(payload.get("entries", []))
          entries.sort(key=lambda row: (row.get("dictionary_index", -1), row.get("id", "")))
          fingerprints = {json.loads(p.read_text(encoding="utf-8")).get("reference_audio_sha256") for p in manifests}
          if len(fingerprints) != 1:
              raise SystemExit("Reference audio fingerprints differ between shards.")
          manifest = {
              "model": "k2-fsa/OmniVoice",
              "language_id": "wo",
              "reference_audio_sha256": next(iter(fingerprints)),
              "voice_identity_validation": "pending-user-listening-confirmation",
              "batch_mode": True,
              "parallel_shards": len(manifests),
              "entries": entries,
          }
          (root / "manifest.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          for path in manifests:
              path.unlink()
          print(f"Assembled {len(entries)} manifest entries from {len(manifests)} parallel shards.")
          PY

      - name: Upload one combined batch for review
        uses: actions/upload-artifact@v4
        with:
          name: wolof-reference-batch-start-${{ inputs.start_index }}
          path: wolof_reference_voice_outputs/
          if-no-files-found: error
          retention-days: 1
