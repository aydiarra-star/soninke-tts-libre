name: Browser smoke — lexique et audio

on:
  pull_request:
    branches: [main, audio/integrate-lexicon-wav]
  push:
    branches: [audio/integrate-lexicon-wav, feat/multilingual-learning-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safari-webkit-smoke:
    name: Parcours navigateur WebKit (proche Safari)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps webkit
      - name: Démarrer le serveur statique
        run: |
          python -m http.server 4173 > /tmp/soninke-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/lexique.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/soninke-http.log
          exit 1
      - name: Tester le chargement du lexique et la lecture audio
        run: npx playwright test tests/browser/audio-smoke.spec.js

  learning-app-webkit-smoke:
    if: github.ref_name == 'feat/multilingual-learning-app' || github.head_ref == 'feat/multilingual-learning-app'
    name: Parcours WebKit de l’application d’apprentissage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer Playwright
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps webkit
      - name: Démarrer le serveur statique
        run: |
          python -m http.server 4173 > /tmp/soninke-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/apprendre.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/soninke-http.log
          exit 1
      - name: Tester le chargement, les données et l’ajout local
        run: npx playwright test tests/browser/learning-app-smoke.spec.js
