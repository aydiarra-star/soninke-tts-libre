name: Échantillons TTS wolof — génération CPU

on:
  push:
    branches:
      - feat/wolof-tts-reader-evaluation
    paths:
      - ".github/workflows/wolof-tts-samples.yml"
      - "scripts/generate_wolof_tts_samples.py"
      - "data/wolof-fr-dictionary.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-samples:
    name: Générer 10 WAV candidats (non validés)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer PyTorch CPU et dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "git+https://github.com/huggingface/parler-tts.git" transformers accelerate soundfile
      - name: Générer les échantillons
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python scripts/generate_wolof_tts_samples.py
      - name: Publier l’archive comme artefact de workflow
        uses: actions/upload-artifact@v4
        with:
          name: wolof-tts-samples-unvalidated
          path: wolof-tts-samples.zip
          if-no-files-found: error
          retention-days: 7
