name: Wolof next-batch planning audit

on:
  push:
    branches:
      - feat/wolof-lexicon-audio-batches
    paths:
      - "data/kaikki-wolof-candidates.json"
      - "wolof_tts/manifests/**"
      - "wolof_tts/plan_next_audio_batch.py"
      - ".github/workflows/wolof-next-batch-plan.yml"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Nombre de candidats à inclure au plan (1 à 20)"
        required: true
        default: "10"
        type: string
      start_offset:
        description: "Décalage dans la liste filtrée et triée"
        required: true
        default: "0"
        type: string
      candidate_snapshot_path:
        description: "Chemin du snapshot Kaikki figé dans la branche"
        required: false
        default: "data/kaikki-wolof-candidates.json"
        type: string
      previous_manifest_paths:
        description: "Chemins des manifestes antérieurs versionnés, séparés par des virgules"
        required: false
        default: "wolof_tts/manifests/historical-audio-headwords.json"
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build review-only candidate snapshot and batch plan
        env:
          PLAN_BATCH_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.batch_size || '10' }}
          PLAN_START_OFFSET: ${{ github.event_name == 'workflow_dispatch' && inputs.start_offset || '0' }}
          CANDIDATE_SNAPSHOT_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_snapshot_path || 'data/kaikki-wolof-candidates.json' }}
          PREVIOUS_MANIFEST_PATHS: ${{ github.event_name == 'workflow_dispatch' && inputs.previous_manifest_paths || 'wolof_tts/manifests/historical-audio-headwords.json' }}
        run: |
          args=(--batch-size "$PLAN_BATCH_SIZE" --start-offset "$PLAN_START_OFFSET" --output wolof-next-audio-batch-plan.json)
          if [ -n "$CANDIDATE_SNAPSHOT_PATH" ]; then
            args+=(--input-candidates "$CANDIDATE_SNAPSHOT_PATH")
          fi
          if [ -n "$PREVIOUS_MANIFEST_PATHS" ]; then
            IFS=',' read -r -a manifests <<< "$PREVIOUS_MANIFEST_PATHS"
            for manifest in "${manifests[@]}"; do
              manifest="$(printf '%s' "$manifest" | xargs)"
              [ -z "$manifest" ] || args+=(--previous-manifest "$manifest")
            done
          fi
          python wolof_tts/plan_next_audio_batch.py "${args[@]}"
      - name: Upload review-only plan
        uses: actions/upload-artifact@v4
        with:
          name: wolof-next-audio-batch-plan
          path: wolof-next-audio-batch-plan.json
          if-no-files-found: error
          retention-days: 14
