name: Wolof TTS audio batch

on:
  push:
    branches:
      - feat/wolof-tts-audio-batch
    paths:
      - "wolof_tts/**"
      - ".github/workflows/wolof-tts-audio.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-wolof-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated work branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'git+https://github.com/huggingface/parler-tts.git' transformers accelerate soundfile numpy
          # Restore CPU-only torchaudio: the Parler-TTS dependency may pull a CUDA wheel.
          python -m pip install --force-reinstall --no-deps torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -c "import torch, torchaudio; print('torch', torch.__version__, 'cuda?', torch.cuda.is_available()); print('torchaudio', torchaudio.__version__)"
      - name: Generate and technically verify Wolof WAVs
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python wolof_tts/generate.py
      - name: Upload WAV archive and manifests
        uses: actions/upload-artifact@v4
        with:
          name: wolof-tts-audio
          path: |
            wolof_tts_audio.zip
            wolof_tts_outputs/manifest.json
            wolof_tts_outputs/manifest.csv
          if-no-files-found: error
          retention-days: 14